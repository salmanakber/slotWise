# Add inside your HTTPS server block for slotwise.hindaralabs.com
# (or include this file). Then: sudo nginx -t && sudo systemctl reload nginx
#
# Why: in-page Webflow embeds call /api/v1/* cross-origin. nginx must send
# Access-Control-Allow-Origin on ALL statuses (use "always"), including 404.

location /api/v1/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Adjust upstream to your Next.js bind (pm2 / 127.0.0.1:3000)
    proxy_pass http://127.0.0.1:3000;

    # Force CORS even when Next returns 4xx/5xx
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
}

location /embed/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:3000;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "*" always;
}
