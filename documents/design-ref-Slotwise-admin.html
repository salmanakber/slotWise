<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slotwise admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Manrope:wght@400;600;800&family=Sora:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--pn:#fff;--ink:#0f1b2d;--mut:#5b6b82;--ln:#e1e6ee;--ac:#f5a000;--on:#1a1203;--at:#9a5b00;--ok:#16895b;--sf:#fff3d6;--sh:0 1px 2px rgba(15,27,45,.06),0 10px 28px rgba(15,27,45,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0b1524;--pn:#132238;--ink:#eaf0f8;--mut:#93a4bc;--ln:#223553;--ac:#ffb020;--on:#1a1203;--at:#ffb020;--ok:#3ccf95;--sf:#2c2616;--sh:0 10px 28px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif;transition:background .3s,color .3s}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.sb{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));padding:20px 14px;border-right:1px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;gap:4px;transition:background .3s}
.lg{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;padding:0 10px 16px}
.lg i{width:18px;height:18px;border-radius:50%;background:var(--ac)}
.nv{display:flex;gap:11px;align-items:center;width:100%;padding:9px 12px;border:0;background:none;color:var(--mut);border-radius:10px;font-weight:600;cursor:pointer;text-align:left}
.nv svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:var(--bg);color:var(--ink)}
.nv.on{background:var(--sf);color:var(--at)}
.bs{margin-top:auto;padding:12px;border:1px solid var(--ln);border-radius:12px;font-size:13px}
.bs small{display:block;color:var(--mut)}
.mn{padding:24px 28px 56px;min-width:0}
.tb{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-weight:800;font-size:26px;line-height:1.2;margin:0}
.tb p{margin:2px 0 0;color:var(--mut)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--mut);padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer}
.seg .on{background:var(--ac);color:var(--on)}
.tsw{background:var(--pn)}
.vw{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.cd{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:18px;box-shadow:var(--sh);transition:background .3s}
.cd h2{font-weight:800;font-size:15px;margin:0 0 12px}
.sub{margin:-6px 0 6px;color:var(--mut);font-size:13px}
.stk{display:grid;gap:14px;align-content:start}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
.kp span{color:var(--mut);font-size:13px}
.kp b{display:block;font-weight:800;font-size:29px;line-height:1.2}
.kp .dl{font-size:12.5px;font-weight:700;color:var(--ok)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.hd h2{margin:0}
.ch{width:100%;height:auto;display:block}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.4s .1s ease forwards}
.ar{opacity:0;animation:fi 1s .7s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fi{to{opacity:1}}
.fr{margin:12px 0}
.fr div:first-child{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.fb{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.fb i{display:block;height:100%;width:0;background:var(--ac);border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.it time{font-weight:800;width:46px}
.it>span{flex:1}
.it small,.row small{display:block;color:var(--mut);font-size:12.5px}
.pl{width:8px;height:8px;border-radius:50%;background:var(--ok);position:relative;display:inline-block;margin-right:6px}
.pl::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;animation:pl 1.8s infinite}
@keyframes pl{to{transform:scale(3.2);opacity:0}}
.tag{display:inline-block;font-style:normal;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--sf);color:var(--at);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.mu{background:var(--bg);color:var(--mut)}
.wr{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th,.tbl td{text-align:left;padding:11px 8px;border-top:1px solid var(--ln);white-space:nowrap}
.tbl th{font-size:12.5px;color:var(--mut);font-weight:600;border-top:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--ln)}
.row>div:last-child{display:flex;align-items:center;gap:8px;flex:none}
select,input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;max-width:100%}
input[type=number]{width:76px}
.sw{width:42px;height:24px;border-radius:99px;border:0;background:var(--ln);position:relative;cursor:pointer;transition:background .25s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s}
.sw.on{background:var(--ac)}
.sw.on::after{transform:translateX(18px)}
.btn{background:var(--pn);border:1px solid var(--ln);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.ts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transform:translateY(12px);transition:.3s;pointer-events:none;z-index:9}
.ts.on{opacity:1;transform:none}
.bw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
.sws{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sws button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;outline-offset:2px}
.sws .on{border-color:var(--ink)}
input[type=color]{width:34px;height:34px;padding:0;border:0;background:none;border-radius:8px;cursor:pointer}
input[type=range]{accent-color:var(--ac);width:150px}
.fr2{position:relative;border:1px solid var(--ln);border-radius:14px;background:var(--bg);padding:16px;min-height:430px;overflow:hidden;--pbg:#fff;--pink:#0f1b2d;--pln:#e1e6ee;--pac:#f5a000;--pon:#1a1203;--pr:14px;--pd:12px}
.sk{height:9px;border-radius:6px;background:var(--ln);margin:9px 0;width:70%}
.fr2[data-l=popup]::before{content:'';position:absolute;inset:0;background:rgba(10,15,25,.5);z-index:1}
.pv{position:relative;z-index:2;background:var(--pbg);color:var(--pink);border:1px solid var(--pln);border-radius:var(--pr);padding:calc(var(--pd) * 1.4);max-width:340px;margin:14px auto 0;box-shadow:0 14px 34px rgba(0,0,0,.16);transition:all .3s}
.pv button{cursor:pointer}
.ph{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:10px}
.ph i{width:14px;height:14px;border-radius:50%;background:var(--pac)}
.pc button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:var(--pd);margin-bottom:6px;background:transparent;border:1px solid var(--pln);border-radius:calc(var(--pr) - 4px)}
.pc .on{border-color:var(--pac);background:color-mix(in srgb,var(--pac) 16%,var(--pbg))}
.pc small{display:block;opacity:.7;font-size:12px}
.pw{display:flex;gap:6px;margin:10px 0}
.pw button{flex:1;padding:8px 0;border:1px solid var(--pln);border-radius:calc(var(--pr) - 6px);background:transparent;font-size:13px}
.pw .on,.ps .on{background:var(--pac);color:var(--pon);border-color:var(--pac)}
.ps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.ps button{padding:8px 0;border:1px solid var(--pln);border-radius:calc(var(--pr) - 6px);background:transparent;font-size:13px}
.pb{width:100%;padding:calc(var(--pd) + 1px);font-weight:800;border-radius:calc(var(--pr) - 4px);background:var(--pac);color:var(--pon);border:1.5px solid var(--pac)}
.fr2[data-b=outline] .pb{background:transparent;color:var(--pink)}
.fr2[data-b=soft] .pb{background:color-mix(in srgb,var(--pac) 22%,var(--pbg));color:var(--pink);border-color:transparent}
.pf{display:block;text-align:center;opacity:.6;font-size:11.5px;margin-top:10px}
.fab{display:none;position:absolute;right:16px;bottom:16px;padding:12px 20px;border-radius:999px;background:var(--pac);color:var(--pon);font-weight:800;border:0;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.fr2[data-l=floating] .pv{display:none}
.fr2[data-l=floating] .fab{display:block}
.fr2.ns .pst,.fr2.np .ppr,.fr2.nd .pdu,.fr2.nb .pf{display:none}
.ldr{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--pbg) 88%,transparent);backdrop-filter:blur(2px)}
.fr2[data-loading=1] .ldr{display:flex}
.ldr-mark{width:52px;height:52px;position:relative}
.ldr-mark svg{width:100%;height:100%;display:block}
.ldr[data-style=pulse] .ldr-slot{transform-origin:center;animation:ldr-pulse 1.1s ease-in-out infinite}
.ldr[data-style=spin] .ldr-ring{transform-origin:center;animation:ldr-spin 1s linear infinite}
.ldr[data-style=draw] .ldr-s{stroke-dasharray:120;stroke-dashoffset:120;animation:ldr-draw 1.4s ease forwards infinite}
.ldr[data-style=calendar] .ldr-dot{animation:ldr-blink 1s steps(1) infinite}
@keyframes ldr-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.55}}
@keyframes ldr-spin{to{transform:rotate(360deg)}}
@keyframes ldr-draw{0%{stroke-dashoffset:120}45%{stroke-dashoffset:0}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-120}}
@keyframes ldr-blink{0%,49%{opacity:1}50%,100%{opacity:.2}}
.ldr span{font-size:12.5px;font-weight:700;color:var(--pink);opacity:.8}
.thg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:2px 0 12px}
.thb{display:grid;gap:8px;padding:8px;border:1px solid var(--ln);border-radius:12px;background:none;cursor:pointer;text-align:left;font-weight:600;font-size:13px}
.thb i{display:block;height:44px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 18%,transparent);background:linear-gradient(var(--a),var(--a)) 12px 28px/34px 8px no-repeat,linear-gradient(var(--c),var(--c)) 12px 12px/54% 6px no-repeat,var(--b)}
.thb.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.pp{display:flex;flex-direction:column;gap:10px}
.pp.cur{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.pp>b{font-size:30px;font-weight:800}
.pp>b small{font-size:13px;color:var(--mut);font-weight:600}
.pp ul{margin:0;padding-left:18px;color:var(--mut);font-size:13.5px;flex:1}
.stp{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln)}
.stp i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ln);flex:none;margin-top:2px;transition:all .3s}
.stp.ok i{background:var(--ok);border-color:var(--ok)}
pre{margin:0;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);overflow-x:auto;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
@media (max-width:980px){.bw{grid-template-columns:1fr}}
@media (max-width:860px){.app{grid-template-columns:1fr}.sb{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px;border-right:0;border-bottom:1px solid var(--ln)}.lg{padding:0 8px 0 4px}.nv{width:auto;white-space:nowrap}.bs{display:none}.mn{padding:18px 16px 48px}.row{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ln{stroke-dashoffset:0}.ar{opacity:1}}
</style>
</head>
