<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slotwise platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--pn:#fff;--ink:#0f1b2d;--mut:#5b6b82;--ln:#e1e6ee;--ac:#f5a000;--on:#1a1203;--at:#9a5b00;--ok:#16895b;--bad:#c0392b;--sf:#fff3d6;--sh:0 1px 2px rgba(15,27,45,.06),0 10px 28px rgba(15,27,45,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0b1524;--pn:#132238;--ink:#eaf0f8;--mut:#93a4bc;--ln:#223553;--ac:#ffb020;--on:#1a1203;--at:#ffb020;--ok:#3ccf95;--bad:#ff6b6b;--sf:#2c2616;--sh:0 10px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.sb{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));padding:20px 14px;border-right:1px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;gap:4px}
.lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:0 10px 14px}
.lg img{width:28px;height:28px;border-radius:8px;object-fit:cover;background:#111}
.lg small{display:block;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.02em}
.nv{display:flex;gap:11px;align-items:center;width:100%;padding:9px 12px;border:0;background:none;color:var(--mut);border-radius:10px;font-weight:600;cursor:pointer;text-align:left}
.nv svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:var(--bg);color:var(--ink)}
.nv.on{background:var(--sf);color:var(--at)}
.bs{margin-top:auto;padding:12px;border:1px solid var(--ln);border-radius:12px;font-size:13px}
.bs small{display:block;color:var(--mut)}
.mn{padding:24px 28px 56px;min-width:0}
.tb{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-weight:800;font-size:26px;line-height:1.2;margin:0}
.tb p{margin:2px 0 0;color:var(--mut)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--mut);padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer}
.seg .on{background:var(--ac);color:var(--on)}
.tsw{background:var(--pn)}
.vw{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.cd{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.cd h2{font-weight:800;font-size:15px;margin:0 0 12px}
.sub{margin:-6px 0 10px;color:var(--mut);font-size:13px}
.stk{display:grid;gap:14px;align-content:start}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
.kp span{color:var(--mut);font-size:13px}
.kp b{display:block;font-weight:800;font-size:29px;line-height:1.2}
.kp .dl{font-size:12.5px;font-weight:700;color:var(--ok)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.hd h2{margin:0}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.it>span{flex:1}
.it small,.row small{display:block;color:var(--mut);font-size:12.5px}
.tag{display:inline-block;font-style:normal;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--sf);color:var(--at);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.mu{background:var(--bg);color:var(--mut)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.wr{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:720px}
.tbl th,.tbl td{text-align:left;padding:11px 8px;border-top:1px solid var(--ln);white-space:nowrap}
.tbl th{font-size:12.5px;color:var(--mut);font-weight:600;border-top:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--ln)}
.row>div:last-child{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap}
select,input[type=text],input[type=number],input[type=password],textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;max-width:100%}
input[type=number]{width:88px}
textarea{width:100%;min-height:88px;resize:vertical}
.sw{width:42px;height:24px;border-radius:99px;border:0;background:var(--ln);position:relative;cursor:pointer;transition:background .25s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s}
.sw.on{background:var(--ac)}
.sw.on::after{transform:translateX(18px)}
.btn{background:var(--pn);border:1px solid var(--ln);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--ln))}
.ts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transform:translateY(12px);transition:.3s;pointer-events:none;z-index:9}
.ts.on{opacity:1;transform:none}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.pp{display:flex;flex-direction:column;gap:10px}
.pp>b{font-size:28px;font-weight:800}
.pp>b small{font-size:13px;color:var(--mut);font-weight:600}
.pp ul{margin:0;padding-left:18px;color:var(--mut);font-size:13.5px;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--ln);font-size:12.5px;font-weight:600;color:var(--mut)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip.off i{background:var(--mut)}
.search{min-width:220px}
.note{padding:12px 14px;border-radius:12px;background:var(--sf);border:1px solid color-mix(in srgb,var(--ac) 28%,var(--ln));font-size:13px;color:var(--at);margin-bottom:14px}
@media (max-width:860px){.app{grid-template-columns:1fr}.sb{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px;border-right:0;border-bottom:1px solid var(--ln)}.lg{padding:0 8px 0 4px;min-width:140px}.nv{width:auto;white-space:nowrap}.bs{display:none}.mn{padding:18px 16px 48px}.row{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
